[package]
name = "toker"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
eventsource-stream = "0.2.3"
futures = "0.3.34"
inquire = "0.9.4"
jiff = "0.2.37"
keyring = "4.2.0"
listenfd = "1.0.2"
nix = { version = "0.31.3", features = ["signal"] }
ratatui = "0.30.2"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order", "arbitrary_precision", "raw_value"] }
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
toml_edit = "0.25.15"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
